name: hh-killer

services:
  bot:
    build:
      context: .
    image: hh-killer-bot
    container_name: hh-killer-bot
    env_file:
      - .env
    environment:
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_USE_CHROME: "false"
      LOG_FILE: /app/logs/bot.log
    restart: unless-stopped
    init: false
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    oom_score_adj: 200
    # docker0 без alias: встроенный bridge их не поддерживает, user-defined сеть
    # compose создаёт/сносит и из‑за iptables может отвалить AmneziaWG.
    network_mode: bridge
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage:ro
    # Порты не публикуем: бот сам ходит к Telegram API по HTTPS (long polling).
