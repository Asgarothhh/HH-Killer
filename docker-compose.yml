name: hh-killer

services:
  bot:
    build:
      context: .
    image: hh-killer-bot
    container_name: hh-killer-bot
    env_file:
      - .env
    environment:
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_USE_CHROME: "false"
      LOG_FILE: ""
    restart: unless-stopped
    init: false
    shm_size: "1gb"
    mem_limit: 2g
    oom_score_adj: 200
    # docker0: без своей compose-сети, чтобы up/down не трогал iptables/AmneziaWG.
    network_mode: bridge
    volumes:
      - ./storage:/app/storage:ro
    # Порты не публикуем: бот сам ходит к Telegram API по HTTPS (long polling).
